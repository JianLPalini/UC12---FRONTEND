<!-- 
    HTML é uma linguagem de marcação
    ou seja, ela Não possue lógica.
    
    o que ela faz?

    Cada elemento possui uma etiqueta que chamamos de 'tag'.
    quando queremos criar algo, chamamos a 'tag' que representa
    aquele elemento. Ou seja, html serve apenas para dizer
    o que existe em uma página.

    As tags precisam ser fechados. <html> </html>
    As tags também possuem atributos. <html lang="en"> </html
-->

<!DOCTYPE html> 
<html lang="pt-BR"> <!-- html é a tag que deve envolver todo o documento -->

<head> <!-- Contém várias informações a respeito da página-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> <!-- titulo da página-->
</head>

<body> <!-- Dentro desta tag é que vamos criar nossos elementos que vão aparecer para o usuário. body significa 'corpo'-->
    <h1>Sobre html</h1> <!-- h1 é a tag de titulo principal -->   
    <h2>Subtitulo</h2>
    <h3>Subtitulo do Subtitulo</h3> 
    <h4>Subtitulo do Subtitulo do Subtitulo</h4>
    <h5>Subtitulo do Subtitulo do Subtitulo do Subtitulo</h5>
    <h6>Subtitulo do Subtitulo do Subtitulo do Subtitulo do Subtitulo</h6>
    <!-- <p> </p> é a tag para escrever um paragrafo-->
    <!-- <br> é o tag pra quebrar a linha. BR vem de 'Break Row', que significa 'Quebrar Linha'-->

    <!-- <hr> criar uma linha horizontal -->
    <hr>
        <!-- <a> é a tag para links. 'a' vem de 'ancora'
        ela sempre é acompanhada do atributo href="" que indica para qual link ela vai direcionar o usuário
        -->
    <a href="https://pt.wallpapers.com/imagens-de-demon-slayer-4k" target="Demon Slayer">Togras</a>

    <!--   <img> é a tag de imagem.
       ela sempre vem com atributos src="", que indicaa origen (onde ela está) e o atributo alt="", que deve conter texto explicativo sobre a imagem.
       Ele sempre é usado caso não carregue ou por sofwares de acessibilidade
       -->

    <img src="https://wall.alphacoders.com/big.php?i=1331191" alt="Tanjiro">

</body>
</html>
