<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Demon Slayer</title>
    <link rel="stylesheet" href="./assets/styles/style.css">
</head>

<body>
    <div class="quiz-container active">

        <div class="pergunta" id="pergunta">
            Qual é o nome da espada usada pelos caçadores de demônios?
        </div>

        <div class="botoes-resposta" id="botoes">
            <button class="btn-resposta" data-resposta="errado">Katana comum</button>
            <button class="btn-resposta" data-resposta="certo">Nichirin Blade</button>
            <button class="btn-resposta" data-resposta="errado">Wakizashi</button>
            <button class="btn-resposta" data-resposta="errado">Arco e flecha</button>
            <button class="btn-resposta" data-resposta="errado">Machado de batalha</button>
        </div>


        <div class="resultado" id="resultado"></div>
        <button class="btn-reiniciar" id="reiniciar">↺ Jogar novamente</button>
    </div>
    <div class="quiz-container">

        <div class="pergunta" id="pergunta">
            Qual é o nome da primeira respiração que Tanjiro Kamado aprendeu?
        </div>

        <div class="botoes-resposta" id="botoes">
            <button class="btn-resposta" data-resposta="errado">Respiração do Sol</button>
            <button class="btn-resposta" data-resposta="certo">Respiração da Água</button>
            <button class="btn-resposta" data-resposta="errado">Respiração do Vento</button>
            <button class="btn-resposta" data-resposta="errado">Respiração da Lua</button>
            <button class="btn-resposta" data-resposta="errado">Respiração do Trovão</button>
        </div>

        <div class="resultado" id="resultado"></div>
        <button class="btn-reiniciar" id="reiniciar">↺ Jogar novamente</button>
    </div>

    <script src="./assets/JS/script.js"></script>
</body>

</html>
